<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Addax Admin - 服务暂不可用</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f8;
        color: #1f2937;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
      }
      main {
        max-width: 480px;
        padding: 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      p {
        margin: 0 0 8px;
        color: #4b5563;
        line-height: 1.6;
      }
      code {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>服务暂不可用</h1>
      <p>后端服务没有响应，请确认 <code>addax-admin</code> 进程已启动并监听在预期端口。</p>
      <p>排查方式：查看后端日志 <code>logs/addax-admin.log</code>，确认数据库和 Redis 连接正常。</p>
    </main>
  </body>
</html>
